# Render blueprint: one Docker web service with a persistent disk. See DEPLOY.md.
# A disk needs a paid instance type — on the free one the journal would vanish on every restart.
services:
  - type: web
    name: djournl
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    disk:
      name: djournl-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: BREVO_API_KEY   # HTTPS email API; use this where outbound SMTP is blocked
        sync: false
      - key: SMTP_HOST       # e.g. smtp.gmail.com, for hosts that allow outbound SMTP
        sync: false
      - key: SMTP_PORT       # 465, or 587 for STARTTLS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS       # a Gmail App Password, never the normal password
        sync: false
      - key: EMAIL_FROM      # e.g. "Djournl <you@gmail.com>"
        sync: false
      - key: RESEND_API_KEY   # alternative, needs a verified Resend domain
        sync: false
      - key: APP_URL          # the public address, for links in reset emails
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
